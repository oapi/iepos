<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CoreTrade ERP — Islam Enterprise management system for sales, purchases, inventory, and financial reporting." />
  <title>CoreTrade ERP — Islam Enterprise</title>

  <!-- PWA & Mobile App Support -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Google Fonts: Inter (Latin) + Noto Sans Bengali (Bangla) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- App root — SPA mounts here -->
  <div id="app"></div>

  <!-- Loading fallback (shown before JS loads) -->
  <div id="initial-loader" style="
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0f172a; flex-direction:column; gap:1rem; z-index:9999;
  ">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
      <rect width="48" height="48" rx="12" fill="#4F46E5"/>
      <text x="24" y="33" text-anchor="middle" font-size="22" font-weight="bold" fill="white" font-family="Inter,sans-serif">CT</text>
    </svg>
    <div style="color:#94a3b8; font-family:Inter,sans-serif; font-size:14px;">Loading CoreTrade ERP…</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
